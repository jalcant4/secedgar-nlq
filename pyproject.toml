[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secedgar-nlq"
version = "0.1.0"
description = "Local SEC EDGAR research agent with deterministic validation"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
secedgar = "secedgar_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "secedgar_agent",
    "llm",
    "repl",
    "edgar",
    "sec_data",
    "accounting",
    "filing_text",
    "financial_trends",
    "compare",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
